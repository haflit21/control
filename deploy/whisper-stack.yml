# Stack Portainer « whisper » : transcription de la voix pour l'agenda de control (Maison).
# speaches = faster-whisper derrière une API compatible OpenAI (POST /v1/audio/transcriptions).
# Sur le macvlan avec sa propre IP, comme les autres services : joignable par le conteneur
# control (192.168.10.6) et par le Mac en développement (make dev-ha), sans passer par le NAS hôte.
#
# Avant de déployer :
#   - vérifier que 192.168.10.10 est libre (hors DHCP .50-.254) ; Pi-hole : whisper.home.arpa → 192.168.10.10 (facultatif)
#   - épingler l'image : remplacer latest-cpu par le tag de version CPU du registre ghcr.io/speaches-ai/speaches
#     (ou par le digest relevé après le premier pull)
# Premier démarrage : le modèle (~500 Mo) est téléchargé depuis Hugging Face, puis gardé dans le volume.
# Pas d'authentification : réservé au réseau des serveurs, jamais publié via NPM.
services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: whisper
    restart: unless-stopped
    environment:
      # télécharge le modèle au démarrage (le conteneur s'arrête si le téléchargement échoue)
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
      # garde le modèle chargé en mémoire (sinon déchargé après 5 min et 2-3 s de plus à la phrase suivante)
      STT_MODEL_TTL: "-1"
      # réglages faster-whisper (variables ignorées sans erreur si la version de speaches les nomme autrement)
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "4"
      TZ: Europe/Paris
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        limits:
          cpus: "4"      # le NAS a 4 cœurs / 8 fils : laisse de la marge à Forgejo et aux autres
          memory: 2g
    networks:
      lan:
        ipv4_address: 192.168.10.10
volumes:
  whisper_models:
networks:
  lan:
    external: true
    name: lan_macvlan
