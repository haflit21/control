  - id: bebe
    name: Chambre bébé
    icon: crib
    image: rooms/bebe.jpg
    devices:
      - id: chauffage
        kind: heating
        name: Chauffage
        primary: true
        entities:
          climate: climate.tado_smart_radiator_thermostat_va1930506240
          humidity: sensor.chambre_bebe_chambre_bebe_humidity
          battery: binary_sensor.tado_smart_radiator_thermostat_va1930506240_battery
          zone_mode: sensor.chambre_bebe_chambre_bebe_zone_mode
      - id: fenetre
        kind: opening
        name: Fenêtre
        entities:
          contact: binary_sensor.window_sensor_child_contact

# Jamais affichés (documentation) : media_player.tv, media_player.tv_2,
# media_player.bbox_miami, Pirate Weather, switch.*_schedule (Tado Hijack),
# switch.desk_pc, input_button.turn_on_pc, permit join Zigbee2MQTT, téléphones.
ignore:
  - media_player.tv
  - media_player.tv_2
  - media_player.bbox_miami
  - switch.desk_pc
  - input_button.turn_on_pc

# Médias : radios jouées sur les enceintes par Home Assistant (media_player.play_media, flux MP3
# de Radio France, les plus sûrs sur une enceinte Cast) ; musique : recherche d'un titre et lecture
# par Music Assistant (module de HA, compte Spotify Premium branché dans Music Assistant, qui envoie
# lui-même le son à l'enceinte ; entities.music = le lecteur Music Assistant de l'enceinte).
# Autre fournisseur possible : spotify (API Web de Spotify, secrets SPOTIFY_*, make spotify-login ;
# l'enceinte doit être visible dans Spotify Connect, ce qu'une enceinte Cast n'est pas au repos).
# make check essaie chaque flux et liste les lecteurs Music Assistant.
media:
  radios:
    # logo : image de l'interface (apps/web/public/radios, logos de Wikimedia Commons)
    - { id: nova, short: N, name: Radio Nova, genre: Grand mix, color: "#f2f2f2", logo: radios/nova.webp, url: "https://novazz.ice.infomaniak.ch/novazz-128.mp3" }
    - { id: inter, short: FI, name: France Inter, genre: Généraliste, color: "#f3c9b4", logo: radios/inter.webp, url: "https://icecast.radiofrance.fr/franceinter-midfi.mp3?id=radiofrance" }
    - { id: culture, short: FC, name: France Culture, genre: Culture et idées, color: "#e5cdea", logo: radios/culture.webp, url: "https://icecast.radiofrance.fr/franceculture-midfi.mp3?id=radiofrance" }
    - { id: info, short: Fi, name: franceinfo, genre: Info en continu, color: "#c3d3f0", logo: radios/franceinfo.webp, url: "https://icecast.radiofrance.fr/franceinfo-midfi.mp3?id=radiofrance" }
    - { id: mouv, short: M, name: Mouv', genre: Rap et urbain, color: "#d8d8d8", logo: radios/mouv.webp, url: "https://icecast.radiofrance.fr/mouv-midfi.mp3?id=radiofrance" }
    - { id: lyon1ere, short: L1, name: Lyon 1ère, genre: Radio de Lyon, color: "#c3d3f0", logo: radios/lyon1ere.webp, url: "https://lyon1ere.ice.infomaniak.ch/lyon1ere-high.mp3" }
  music:
    provider: music_assistant

# Personnes du foyer. Chacune a son agenda personnel (id = celui de la personne), en plus des
# calendriers communs ci-dessous, et peut être reconnue au réveil de la tablette : visages
# enrôlés depuis l'app (cloche › Personnes et visages), empreintes gardées par le service face.
# L'id sert aussi dans le service face : minuscules, chiffres, - et _.
people:
  - { id: abdelhak, name: Abdelhak, color: "#7aa7e0" }
  - { id: marion, name: Marion, color: "#c58fd6" }
  - { id: idris, name: Idris, color: "#e2c264" }

# Reconnaissance de visage : service face du homelab (dépôt ahomelab/face, YuNet + SFace sur le
# CPU du NAS), jeton FACE_API_KEY dans les secrets (= CONTROL_TOKEN des secrets de face). Une
# photo prise au réveil de l'écran de veille, jamais stockée. Personnalise l'accueil, n'autorise rien.
face:
  url: http://face.home.arpa

# Agenda familial, tenu par l'app (state/agenda/events.json). Le premier calendrier est celui par défaut.
agenda:
  calendars:
    - { id: famille, name: Famille, color: "#ec9b74" }
    - { id: poubelles, name: Poubelles, color: "#6fcf9a", hint: "poubelles, tri, verre, encombrants, déchetterie" }
  # Saisie rapide : une phrase (tapée ou dictée) devient un formulaire pré-rempli.
  voice:
    # parole → texte : service stt du homelab (dépôt ahomelab/stt, Parakeet TDT 0.6B v3 sur le
    # CPU du NAS, ~1,5 s par phrase), API compatible OpenAI, jeton STT_API_KEY dans les secrets
    # (= CONTROL_TOKEN des secrets de stt). Le micro du navigateur exige HTTPS.
    transcribe:
      url: http://stt.home.arpa
      model: parakeet-tdt-0.6b-v3
      language: fr
    # texte → événement : claude-gateway (abonnement Claude, profil calendar : Haiku),
    # jeton CLAUDE_GATEWAY_TOKEN dans les secrets. Autres fournisseurs : anthropic (clé
    # ANTHROPIC_API_KEY), openai (modèle local : url …/v1 + model).
    understand:
      provider: gateway
      url: http://claude.home.arpa
      profile: calendar
